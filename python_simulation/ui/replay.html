<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinel — AML Analyst Console</title>
<style>
:root{--bg:#0e1117;--panel:#161b22;--line:#2a323d;--txt:#e6edf3;--dim:#8b98a5;
--green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;
background:linear-gradient(180deg,#141a22,#0e1117);position:sticky;top:0;z-index:5}
.logo{font-weight:700;font-size:17px}.logo b{color:var(--blue)}.sub{color:var(--dim);font-size:12px}
.chips{margin-left:auto;display:flex;gap:10px}.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%}
button{background:var(--blue);color:#04121f;border:0;border-radius:7px;padding:8px 16px;font-weight:650;cursor:pointer;font-size:13px}
button:disabled{opacity:.4;cursor:default}
.wrap{max-width:1080px;margin:0 auto;padding:18px 22px 60px}
.funnel{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12.5px;margin:6px 0 16px;flex-wrap:wrap}
.funnel b{color:var(--txt)}.arrow{color:var(--line)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid #1a2029;vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:#12181f}tr.row.sel td{background:#12181f}
.mono{font-family:var(--mono);font-size:12.5px}.t{color:var(--dim);font-variant-numeric:tabular-nums}
.rulechip{display:inline-block;background:#20272f;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10.5px;color:var(--dim);margin:1px 3px 1px 0;font-family:var(--mono)}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;white-space:nowrap}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.badge{padding:3px 9px;border-radius:5px;font-weight:650;font-size:11.5px}
.b-approve{background:rgba(63,185,80,.14);color:var(--green);border:1px solid rgba(63,185,80,.35)}
.b-escalate{background:rgba(210,153,34,.14);color:var(--amber);border:1px solid rgba(210,153,34,.35)}
.b-block{background:rgba(248,81,73,.14);color:var(--red);border:1px solid rgba(248,81,73,.35)}
.b-new{color:var(--red)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:9}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:480px;max-width:92vw;background:#12171e;border-left:1px solid var(--line);
transform:translateX(100%);transition:transform .24s ease;z-index:10;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line)}
.dh .x{float:right;cursor:pointer;color:var(--dim);font-size:20px;line-height:1}
.dh .acct{font-family:var(--mono);font-size:18px;font-weight:600}.dh .meta{color:var(--dim);font-size:12px;margin-top:3px}
.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.typ{background:#20272f;border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-size:11.5px;font-family:var(--mono)}
.conf{color:var(--dim);font-size:12.5px}
.truth{font-size:11px;padding:3px 9px;border-radius:5px}
.truth.ok{background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.truth.miss{background:rgba(248,81,73,.1);color:var(--red);border:1px solid rgba(248,81,73,.3)}
.truth.neutral{background:#20272f;color:var(--dim);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line)}
.tab{padding:8px 14px;cursor:pointer;color:var(--dim);font-size:13px;font-weight:600;border-bottom:2px solid transparent}
.tab.on{color:var(--txt);border-bottom-color:var(--blue)}
.dbody{padding:18px 20px;overflow-y:auto;flex:1}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:16px 0 8px}
.sec:first-child{margin-top:0}
.headline{font-size:15px;line-height:1.5;color:#eaf1f8;font-weight:500}
.detail{color:#c1ccd6;line-height:1.6;font-size:13px;margin-top:8px}
.ev{border-left:3px solid var(--line);padding:8px 12px;margin:7px 0;background:#161c24;border-radius:0 6px 6px 0}
.ev.fraud{border-left-color:var(--red)}.ev.legit{border-left-color:var(--green)}.ev.neutral{border-left-color:var(--dim)}
.ev .l{font-weight:600;font-size:12.5px;margin-bottom:3px}.ev .v{color:var(--dim);font-size:12px;line-height:1.5}
.step{display:flex;gap:11px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #1a2029;font-size:13px}
.step .n{color:var(--blue);font-family:var(--mono);font-size:11px;min-width:20px}
.step .chk{color:var(--green)}
.empty{color:var(--dim);text-align:center;padding:60px 0}.hint{color:var(--dim);font-size:12px;margin-left:8px}
</style></head><body>

const tb=document.getElementById('tb'),empty=document.getElementById('empty');
let nAlert=0,nWork=0,nAppr=0,nEsc=0,nBlk=0;
function stat(){fAlert.textContent=nAlert;fAppr.textContent=nAppr;fEsc.textContent=nEsc;fBlk.textContent=nBlk;cAgents.textContent=nWork;}
const RM={approve:{c:'b-approve',t:'Auto-closed',i:'✅'},escalate:{c:'b-escalate',t:'Escalated',i:'⚠️'},block:{c:'b-block',t:'Blocked',i:'🚫'}};
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(c,i){
  const row=document.createElement('tr');row.className='row';row.id='r'+i;
  row.innerHTML=`<td class="t">${c.time}</td><td class="mono">${c.id}</td><td class="mono">${c.account}</td>
   <td>${c.rules.map(r=>`<span class="rulechip">${r}</span>`).join('')}</td>
   <td><span class="status" id="st${i}"><span class="b-new pulse">🔴 New alert</span></span></td>`;
  row.onclick=()=>{if(c._done)openCase(c,i);};
  tb.appendChild(row);
}
function setSt(i,h){document.getElementById('st'+i).innerHTML=h;}
function investigate(c,i){
  nWork++;stat();setSt(i,`<span class="spin"></span><span style="color:var(--blue)">Agent investigating…</span>`);

  setTimeout(()=>finish(c,i),dur);
}
function finish(c,i){
  c._done=true;nWork--;const m=RM[c.recommendation];
  if(c.recommendation==='approve')nAppr++;else if(c.recommendation==='escalate')nEsc++;else nBlk++;stat();
  setSt(i,`<span class="badge ${m.c}">${m.i} ${m.t}</span>`);
}
function truthBadge(c){
  let tc,ti,tt;
  if(c.recommendation==='approve'){if(c.truth==='laundering'){tc='miss';ti='✕';tt='missed — was laundering';}else{tc='ok';ti='✓';tt='correctly cleared';}}
  else if(c.truth==='laundering'){tc='ok';ti='✓';tt='caught — real laundering';}
  else{tc='neutral';ti='•';tt='legit — sent for review, no harm';}
  return `<span class="truth ${tc}">${ti} ${tt}</span>`;
}
function openCase(c,i){

  document.getElementById('dwrap').innerHTML=`

   </div>
   <div class="tabs"><div class="tab on" id="tabA" onclick="tabSwap('A')">Case summary</div>
     <div class="tab" id="tabB" onclick="tabSwap('B')">Agent activity (${c.actions.length})</div></div>

     ${conc.length?`<div class="sec">⚑ Concerning evidence</div>${evHtml(conc)}`:''}
     ${exc.length?`<div class="sec">✓ Exculpatory evidence</div>${evHtml(exc)}`:''}
   </div>
   <div class="dbody" id="paneB" style="display:none">

  document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on');
}
function tabSwap(t){tabA.classList.toggle('on',t==='A');tabB.classList.toggle('on',t==='B');

function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on');
